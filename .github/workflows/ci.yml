name: PatentIQ Enterprise CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Run Pytest
      run: |
        cd backend
        pytest tests/ -v --cov=services

  test-frontend:
    name: Frontend Tests & Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json' # Adjust if using yarn/pnpm
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    - name: Lint and type check
      run: |
        cd frontend
        npm run lint
        npx tsc --noEmit

  build-and-push-docker:
    name: Build & Push Docker Images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    
    # Mocking actual Dockerhub login for template
    # - name: Log in to Docker Hub
    #   uses: docker/login-action@v2
    #   with:
    #     username: ${{ secrets.DOCKER_USERNAME }}
    #     password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build Backend Image
      run: |
        docker build -t patentiq/backend:latest -f backend/Dockerfile .
        
    - name: Build Frontend Image
      run: |
        docker build -t patentiq/frontend:latest -f frontend/Dockerfile .
        
    # - name: Push Images
    #   run: |
    #     docker push patentiq/backend:latest
    #     docker push patentiq/frontend:latest
