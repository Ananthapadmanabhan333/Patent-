version: "3.8"

services:
  # Multimodal parsing & evaluation gateway API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENVIRONMENT=production
    volumes:
      - talentos_db:/app/data
    restart: unless-stopped

  # High-fidelity React 19 Recruiter Dashboard UI
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  talentos_db:
