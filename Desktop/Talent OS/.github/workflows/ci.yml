name: TALENTOS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Validate backend Python code quality, imports, and mathematical formulas
  backend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Codebase
        uses: actions/checkout@v3

      - name: Configure Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install Backend Packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Rigorous Scoring and Parser Tests
        run: |
          python -m unittest backend.tests.test_scoring

  # Validate frontend React compilation and rigid TypeScript constraints
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Codebase
        uses: actions/checkout@v3

      - name: Configure Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend NPM Modules
        run: |
          cd frontend
          npm ci

      - name: Verify Strict TS Compilation & Vite Bundler
        run: |
          cd frontend
          npm run build
